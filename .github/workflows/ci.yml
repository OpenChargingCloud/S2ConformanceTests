name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Manual runs from the Actions tab ("Run workflow"), same as nightly.yml.
  workflow_dispatch:

concurrency:
  # Pull requests: one run per branch, newest wins — a run against a head that has been
  # superseded is answering a question nobody is asking any more.
  #
  # Pushes: one run per commit, and nothing cancels anything. A commit with no verdict is
  # a hole nobody comes back to fill: the next commit contains it, so the code does get
  # tested eventually, but once that run is red there is no longer any way to say which of
  # the two commits did it.
  #
  # Keying the group on the SHA, rather than only turning cancel-in-progress off, is what
  # makes that hold for more than two pushes: a group keeps at most one run *pending*, so
  # a third push discards the second before it ever starts.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  interop:
    name: Interoperability tests (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    # One leg per platform this suite is expected to work on:
    #
    #  * Debian 13, because that is what the stack runs on in production. GitHub offers no
    #    Debian runner image, so this leg runs on an Ubuntu runner inside a debian:13
    #    container. Deliberately NOT the official .NET SDK image: that is still
    #    Debian-12-based, and Debian 13 is also what ships Python 3.13 — the newest Python
    #    s2-python 0.10.0 accepts. This is the only leg that can build s2-rust's S2 Connect
    #    crate (s2energy-connection is Unix-only), so it runs everything, and a missing
    #    toolchain is a failure here (S2_INTEROP_REQUIRE), never a silent skip.
    #  * Windows, because that is where WWCP S2 is developed, and TLS goes through
    #    Schannel/CryptoAPI instead of OpenSSL. The S2 Connect drivers would need WSL
    #    there, which a hosted runner does not have, so those fixtures skip with a reason
    #    — the s2-python tests and the s2-rust message layer are the gate on this leg.
    #
    # fail-fast is off on purpose: "red on exactly one platform" is the most valuable
    # signal this matrix produces, so one leg must not cancel the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: debian:13
            leg: debian-13-container
          - os: windows-latest
            leg: windows-latest

    steps:

      # FIRST, before the checkout: the bare debian:13 image has no git, and
      # actions/checkout silently falls back to downloading a tarball through the REST API
      # when it cannot find one. That yields a working tree with no .git directory, and the
      # submodule checkout then fails on a repository that is not a repository.
      #
      # The rest: the .NET runtime prerequisites that setup-dotnet needs before it can
      # install the SDK (curl for the dotnet-install script itself, ICU and tzdata for
      # globalization, OpenSSL for crypto, ca-certificates for NuGet and git over HTTPS),
      # gcc and libc6-dev because rustc links through the system C compiler, and Python
      # 3.13 with the venv module for s2-python (Debian splits ensurepip out of the
      # interpreter package). Package names verified on Debian 13 (trixie).
      - name: Install prerequisites (Debian container)
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gcc libc6-dev libicu76 libssl3t64 libstdc++6 tzdata \
            python3 python3-venv
          # Everything in this container runs as root while the workspace comes from the
          # host, which git reads as dubious ownership and refuses to touch. checkout sets
          # this for the repository itself; the submodule working trees below are not
          # covered by that.
          git config --global --add safe.directory '*'

      # The "s2-rust client -> WWCP server" pairing tests let s2-rust address the WWCP
      # pairing server as "wwcp-cem.local": s2-rust chooses the LAN challenge-response
      # formula from the ".local" suffix. On Windows the harness writes that alias into the
      # WSL distribution's /etc/hosts itself; natively it expects the name to resolve to
      # loopback already, which is what this line arranges.
      - name: Map wwcp-cem.local to loopback (Debian container)
        if: runner.os == 'Linux'
        run: echo "127.0.0.1 wwcp-cem.local" >> /etc/hosts

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Windows only: the Debian leg has its Python from apt above, and setup-python's
      # prebuilt interpreters are made for the Ubuntu runner images, not for a container.
      - name: Setup Python
        if: runner.os == 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/s2-rust-harness

      # The "connect" feature pulls in s2energy-connection and the S2 Connect drivers; on
      # Windows it is left out and only the message-layer driver (s2-json-echo) is built,
      # which is what the harness does there as well.
      - name: Build the s2-rust drivers
        working-directory: tools/s2-rust-harness
        shell: bash
        run: cargo build --release ${{ runner.os == 'Linux' && '--features connect' || '' }}

      - name: Build
        run: dotnet build S2InteropTests/S2InteropTests.csproj --configuration Release

      # The protocol stack itself lives in the WWCP_S2 submodule and brings its own tests;
      # WWCP_S2Tests is part of this build anyway (the schema validator and the [S2C]
      # attribute come from it). Its own CI builds against Hermod and Styx at the refs it
      # pins, while this run builds against the submodule pins here — this one says "the
      # pinned stack passes", the other "the stack passes against what its foundations
      # look like today". Timing, Multicast and Interop are its nightly categories
      # (PLAN.md §8 of WWCP_S2), so they stay out, as in its own gate.
      - name: Test the S2 protocol stack
        timeout-minutes: 30
        run: dotnet test libs/WWCP_S2/WWCP_S2Tests/WWCP_S2Tests.csproj --configuration Release --no-build --filter "TestCategory!=Timing&TestCategory!=Multicast&TestCategory!=Interop" --logger "console;verbosity=normal" --logger "trx;LogFileName=${{ matrix.leg }}-stack.trx" --results-directory artifacts

      # The drivers are already built, so the harness must not run cargo again
      # (S2_INTEROP_SKIP_CARGO_BUILD). The first fixture creates .venv-s2python from
      # libs/s2-python; that needs PyPI for pydantic and websockets.
      - name: Interoperability tests
        if: runner.os == 'Linux'
        timeout-minutes: 30
        env:
          S2_INTEROP_REQUIRE: "1"
          S2_INTEROP_SKIP_CARGO_BUILD: "1"
        run: dotnet test S2InteropTests/S2InteropTests.csproj --configuration Release --no-build --filter "TestCategory=Interop" --logger "console;verbosity=normal" --logger "trx;LogFileName=${{ matrix.leg }}-interop.trx" --results-directory artifacts

      # Windows in two steps, because S2_INTEROP_REQUIRE is all or nothing: the s2-python
      # fixtures must not be allowed to skip (a missing interpreter would otherwise pass
      # this leg with nothing tested), while the S2 Connect fixtures of s2-rust have to —
      # they need WSL, and a hosted runner has none. The message-layer tests of s2-rust run.
      - name: Interoperability tests against s2-python
        if: runner.os == 'Windows'
        timeout-minutes: 30
        env:
          S2_INTEROP_REQUIRE: "1"
          S2_INTEROP_SKIP_CARGO_BUILD: "1"
        run: dotnet test S2InteropTests/S2InteropTests.csproj --configuration Release --no-build --filter "TestCategory=s2-python" --logger "console;verbosity=normal" --logger "trx;LogFileName=${{ matrix.leg }}-s2-python.trx" --results-directory artifacts

      - name: Interoperability tests against s2-rust (message layer)
        if: runner.os == 'Windows'
        timeout-minutes: 30
        env:
          S2_INTEROP_SKIP_CARGO_BUILD: "1"
        run: dotnet test S2InteropTests/S2InteropTests.csproj --configuration Release --no-build --filter "TestCategory=s2-rust" --logger "console;verbosity=normal" --logger "trx;LogFileName=${{ matrix.leg }}-s2-rust.trx" --results-directory artifacts

      # The console log answers "did it pass" and almost nothing else. TRX keeps per test:
      # outcome, duration, error message and the Assert.Ignore reason — and the skips and
      # warnings in this suite are load-bearing (the WSL-only fixtures on Windows, the
      # Interop.KnownIssue markers), while neither reaches the console at normal
      # verbosity. It also survives the run: `gh run download` gets structured results
      # where the log view needs a signed-in browser session.
      #
      # !cancelled() rather than success(): a red run is when these files matter most, so
      # uploading only on green would discard the evidence in exactly that case.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.leg }}
          path: artifacts/*.trx
